<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Responsive viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="DeamHR – Human Resource Management">
  <meta name="theme-color" content="#ffffff">

  <!-- Favicon (unchanged) -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Google Font for brand text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">

  <title>DeamHR</title>

  <!-- Loader stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ══════════════════════════════════════════
       Splash / Loader
  ══════════════════════════════════════════ -->
  <div id="loader" role="status" aria-label="Loading DeamHR">

    <!-- Logo (on the left, vertically centered with Title) -->
    <img id="loader-logo" src="favicon.png" alt="DeamHR logo">

    <!-- Brand text (on the right, Row 1) -->
    <h1 class="brand-text">DEAM HR</h1>

    <!-- QuarterRing spinner (on the right, Row 2 - centered under "M") -->
    <div class="quarter-ring-wrapper" aria-hidden="true">
      <span class="quarter-ring"></span>
    </div>

    <!-- Percentage counter (on the right, Row 3) -->
    <span id="loader-percent">0%</span>

  </div>
  <!-- /loader -->

  <!-- Inline Loader Controller (Must be inline to capture 'flutter-first-frame' immediately) -->
  <script>
    (function () {
      'use strict';

      var percentEl = document.getElementById('loader-percent');
      var loaderEl  = document.getElementById('loader');

      var current  = 0;
      var targetPct = 92;
      var interval  = null;

      function tick() {
        if (current >= targetPct) {
          clearInterval(interval);
          return;
        }
        var remaining = targetPct - current;
        var step = Math.max(0.4, remaining * 0.045);
        current = Math.min(current + step, targetPct);

        if (percentEl) {
          percentEl.textContent = Math.floor(current) + '%';
        }
      }

      interval = setInterval(tick, 28);

      // Dismiss loader on first frame
      window.addEventListener('flutter-first-frame', function () {
        clearInterval(interval);
        current = 100;
        if (percentEl) percentEl.textContent = '100%';

        setTimeout(function () {
          if (loaderEl) loaderEl.classList.add('hidden');
        }, 300);
      });

      // Fallback: If Flutter fails to run or load, proceed to 100% and auto-hide after 8 seconds
      setTimeout(function () {
        if (current < 100) {
          clearInterval(interval);
          var finalInterval = setInterval(function() {
            if (current >= 100) {
              clearInterval(finalInterval);
              if (loaderEl) loaderEl.classList.add('hidden');
            } else {
              current += 2;
              if (percentEl) percentEl.textContent = Math.min(100, Math.floor(current)) + '%';
            }
          }, 30);
        }
      }, 8000);

    })();
  </script>

  <!-- Flutter bootstrap (async so it does not block the splash) -->
  <script src="flutter_bootstrap.js" async></script>

</body>
</html>
